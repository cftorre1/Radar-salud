[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-salud"
version = "0.1.0"
description = "Radar Salud intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.0.0",
  "openpyxl>=3.1.0",
  "openai>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
