[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-salud"
version = "0.1.0"
description = "Radar Salud intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "pypdf[crypto]==6.20.0",
  "cryptography>=43",
  "certifi",
  "openpyxl>=3.1.0",
  "openai>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# English word list used by global_translation (Title Case words that are not names) and its licence notice.
radar_salud = ["lexicon/en_words.txt.gz", "lexicon/LICENSE-SCOWL.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
