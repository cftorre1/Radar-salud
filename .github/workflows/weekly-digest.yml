name: Weekly Alicanto digest

on:
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * 5'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Alicanto package
        run: python -m pip install -e .
      - name: Send weekly digest
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/send_weekly_digest.py
