name: Pulso retained zero-observation original
on:
  push:
    branches: [codex/b-pulso-runtime-20261011]
    paths: ['.github/run-pulso-zero-original-now']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b-pulso-runtime-20261011
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: pulso-real-core-*
          path: .scratch/second-original
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 38194404484
      - name: Verify exact existing bytes without publisher HTTP or model calls
        run: PYTHONPATH=. python scripts/retain_pulso_zero_original.py --artifact-root .scratch/second-original --output tests/fixtures/pulso_zero_observation_real
      - name: Preserve original exclusively on Source branch
        run: |
          test "$GITHUB_REF" = refs/heads/codex/b-pulso-runtime-20261011
          git config user.name alicanto-salud-bot
          git config user.email alicanto-salud-bot@users.noreply.github.com
          git add tests/fixtures/pulso_zero_observation_real
          git diff --cached --quiet || git commit -m "audit(pulso): preserve exact second-observation original [skip ci]"
          git push origin HEAD:codex/b-pulso-runtime-20261011
      - uses: actions/upload-artifact@v4
        with:
          name: pulso-zero-original-${{ github.sha }}
          path: tests/fixtures/pulso_zero_observation_real
          retention-days: 90
