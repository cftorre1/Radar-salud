name: SIS normativa inventory probe

# Dirección 9-nov-2026 (punto B): inventory of every SIS normative document type under /normativa/
# (WordPress REST API, archive pagination, sitemaps), robots.txt honoured, daily-scout User-Agent.
# Runs only on its own branch; never touches staging data. The receipt is committed to this branch only.
on:
  push:
    branches: [claude/sis-normativa-probe]
    paths:
      - .github/workflows/sis-normativa-probe.yml
      - scripts/probe_sis_normativa.py

permissions:
  contents: write

jobs:
  probe:
    if: github.ref == 'refs/heads/claude/sis-normativa-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/sis-normativa-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe SIS normative inventory (robots.txt honoured)
        run: python scripts/probe_sis_normativa.py --output "data/audits/sis_normativa_probe/${GITHUB_RUN_ID}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sis-normativa-probe-${{ github.run_id }}
          path: data/audits/sis_normativa_probe/
      - name: Commit the receipt to this branch only
        run: |
          git config user.name "alicanto-salud-bot"
          git config user.email "alicanto-salud-bot@users.noreply.github.com"
          git add data/audits/sis_normativa_probe
          git commit -m "chore: SIS normativa probe receipt ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:claude/sis-normativa-probe
