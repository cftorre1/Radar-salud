name: Isolated Global metadata diagnostics
on:
  push:
    branches: [codex/global-intelligence-recurrent-20261011]
    paths: ['.github/run-global-diagnostics-now']
permissions:
  contents: write
jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/global-intelligence-recurrent-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python scripts/diagnose_global_surfaces.py
      - name: Persist official diagnostic metadata
        if: always()
        run: |
          git config user.name "alicanto-salud-bot"
          git config user.email "alicanto-salud-bot@users.noreply.github.com"
          git add data/audits/global_source_recovery_2026_10_11/diagnostics
          git diff --cached --quiet || git commit -m "audit(global): preserve official title and archive diagnostics"
          git push origin HEAD:codex/global-intelligence-recurrent-20261011
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-diagnostics-${{ github.run_id }}
          path: work/global-diagnostic-captures/
