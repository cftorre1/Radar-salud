name: Alicanto Autopilot
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: alicanto-staging-writer
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - name: Autopilot V1 liveness gate
        run: python scripts/orchestrator_liveness.py --threshold-minutes 60
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Reserve persistent daily slot before execution
        id: reserve
        run: |
          git config user.name alicanto-autopilot
          git config user.email alicanto-autopilot@users.noreply.github.com
          git worktree add /tmp/autopilot-state origin/autopilot-state
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          python scripts/autopilot_cycle.py reserve --ledger /tmp/autopilot-state/data/autopilot/ledger.json --sha "$CANDIDATE_SHA"
          if [ "$(sed -n 's/^reserved=//p' "$GITHUB_OUTPUT" | tail -1)" = true ]; then
            git -C /tmp/autopilot-state add data/autopilot/ledger.json
            git -C /tmp/autopilot-state commit -m "chore: reserve Autopilot attempt"
            git -C /tmp/autopilot-state push origin HEAD:autopilot-state
          fi
      - name: Builder, isolated staging, Reviewer and QA
        id: cycle
        if: steps.reserve.outputs.reserved == 'true'
        env:
          ALICANTO_CANDIDATE_SHA: ${{ steps.reserve.outputs.sha }}
        run: python scripts/autopilot_cycle.py execute --ledger /tmp/autopilot-state/data/autopilot/ledger.json --sha '${{ steps.reserve.outputs.sha }}'
      - name: Persist outcome even when candidate is blocked
        if: ${{ always() && steps.reserve.outputs.reserved == 'true' }}
        run: |
          git -C /tmp/autopilot-state add data/autopilot/ledger.json
          git -C /tmp/autopilot-state diff --cached --quiet || git -C /tmp/autopilot-state commit -m "chore: record Autopilot result"
          git -C /tmp/autopilot-state push origin HEAD:autopilot-state
          cp web/data/product.json /tmp/autopilot-state/data/autopilot/product.json
          git -C /tmp/autopilot-state add data/autopilot/product.json
          git -C /tmp/autopilot-state diff --cached --quiet || git -C /tmp/autopilot-state commit -m "chore: preserve product diagnostics"
          git -C /tmp/autopilot-state push origin HEAD:autopilot-state
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.reserve.outputs.reserved == 'true' }}
        with:
          name: autopilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test-results/
            data/autopilot/
      - name: Dispatch and verify staged preview with critical checks
        if: steps.cycle.outputs.qa_passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run staging-preview.yml --ref staging
          RUN_ID=""
          for attempt in 1 2 3 4 5 6; do
            RUN_ID=$(gh run list --workflow staging-preview.yml --branch staging --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "No remote staging preview run could be resolved"
            exit 1
          fi
          set +e
          gh run watch "$RUN_ID" --exit-status
          PREVIEW_STATUS=$?
          set -e
          python - "$RUN_ID" "$PREVIEW_STATUS" '${{ steps.reserve.outputs.sha }}' <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          run_id, status, sha = sys.argv[1:]
          target=Path('/tmp/autopilot-state/data/autopilot/preview.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
              "run_id": int(run_id),
              "candidate_sha": sha,
              "result": "success" if status == "0" else "failure",
              "verified_at": datetime.now(timezone.utc).isoformat()
          }, indent=2) + "\\n")
          PY
          git -C /tmp/autopilot-state add data/autopilot/preview.json
          git -C /tmp/autopilot-state diff --cached --quiet || git -C /tmp/autopilot-state commit -m "chore: record remote preview result"
          git -C /tmp/autopilot-state push origin HEAD:autopilot-state
          exit "$PREVIEW_STATUS"
      # Promotion is deliberately unavailable until the initial remote staging
      # acceptance and full Signal Density contract have been verified.
      # Do not turn a Boolean into an unchecked release authorization.
