name: Pulso LIVE9 original evidence
on:
  push:
    branches: [codex/b-pulso-runtime-20261011]
    paths:
      - .github/run-pulso-live9-originals-now
      - .github/workflows/pulso-live9-originals.yml
      - scripts/retain_pulso_live9_originals.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pulso-live9-original-evidence
  cancel-in-progress: false
jobs:
  originals:
    if: github.ref == 'refs/heads/codex/b-pulso-runtime-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b-pulso-runtime-20261011
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - name: Assert own branch and exact existing target commit
        id: targets
        run: |
          test "$(git branch --show-current)" = codex/b-pulso-runtime-20261011
          python - <<'PY'
          import json,os,re,subprocess
          marker=json.load(open('.github/run-pulso-live9-originals-now'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for field in ('target_commit','current_commit'):
                  target=marker[field]
                  if not re.fullmatch('[0-9a-f]{40}',target):raise SystemExit('Invalid immutable target commit')
                  subprocess.run(['git','cat-file','-e',target+'^{commit}'],check=True)
                  output.write(field+'='+target+'\n')
          PY
      - name: Verify retention hash and path guards
        run: pytest -q tests/test_retain_pulso_live9_originals.py
      - name: Download exact original artifact with supported Actions client
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cftorre1/Radar-salud
          run-id: 38149773071
          name: pulso-real-core-81b844a654533891ad0923a40dfedfda03c17fa3
          path: .scratch/pulso-live9-original-artifact
      - name: Download historical original primary artifact 38159032940
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cftorre1/Radar-salud
          run-id: 38159032940
          name: pulso-real-core-03bf998a4bb5840c84da6473666e932fbc5cedd9
          path: .scratch/pulso-live9-original-artifact-38159032940
      - name: Download historical original primary artifact 38172352115
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cftorre1/Radar-salud
          run-id: 38172352115
          name: pulso-real-core-de51496ca0bfbe656c96551743e52024b9b6608e
          path: .scratch/pulso-live9-original-artifact-38172352115
      - name: Download historical original primary artifact 38181190464
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cftorre1/Radar-salud
          run-id: 38181190464
          name: pulso-real-core-46a3683c6760f0e61031a7dc7d5961c105cacb36
          path: .scratch/pulso-live9-original-artifact-38181190464
      - name: Download actual updated paid primary artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cftorre1/Radar-salud
          run-id: 38183583899
          name: pulso-real-core-1b4817164dbd9cd091197e1c7ebd03de6fa93526
          path: .scratch/pulso-live9-paid-artifact
      - name: Verify immutable ZIPs and retain nine originals plus observed paid update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/cftorre1/Radar-salud/actions/artifacts/11707255596/zip > .scratch/pulso-live9-original.zip
          gh api repos/cftorre1/Radar-salud/actions/artifacts/11718992843/zip > .scratch/pulso-live9-paid.zip
          gh api repos/cftorre1/Radar-salud/actions/artifacts/11710432466/zip > .scratch/pulso-live9-original-38159032940.zip
          gh api repos/cftorre1/Radar-salud/actions/artifacts/11714388920/zip > .scratch/pulso-live9-original-38172352115.zip
          gh api repos/cftorre1/Radar-salud/actions/artifacts/11718153077/zip > .scratch/pulso-live9-original-38181190464.zip
          python scripts/retain_pulso_live9_originals.py --artifact-zip .scratch/pulso-live9-original.zip --artifact-root .scratch/pulso-live9-original-artifact --target-commit '${{ steps.targets.outputs.target_commit }}' --live-artifact-zip .scratch/pulso-live9-paid.zip --live-artifact-root .scratch/pulso-live9-paid-artifact --current-commit '${{ steps.targets.outputs.current_commit }}' --supplemental-artifact-zip .scratch/pulso-live9-original-38159032940.zip --supplemental-artifact-root .scratch/pulso-live9-original-artifact-38159032940 --supplemental-artifact-zip .scratch/pulso-live9-original-38172352115.zip --supplemental-artifact-root .scratch/pulso-live9-original-artifact-38172352115 --supplemental-artifact-zip .scratch/pulso-live9-original-38181190464.zip --supplemental-artifact-root .scratch/pulso-live9-original-artifact-38181190464
      - name: Preserve only original evidence on the isolated branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          test -d tests/fixtures/pulso_live9_primary_real || exit 0
          git add -- tests/fixtures/pulso_live9_primary_real
          git diff --cached --quiet || git commit -m 'audit(pulso): retain nine original LIVE primary responses and actual paid update [skip ci]'
          git fetch origin codex/b-pulso-runtime-20261011
          git rebase origin/codex/b-pulso-runtime-20261011
          git push origin HEAD:codex/b-pulso-runtime-20261011
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulso-live9-original-evidence-${{ github.run_id }}
          path: tests/fixtures/pulso_live9_primary_real
