name: Deploy static content to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  staged-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require successful remote staging of this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/staging-preview.yml/runs?head_sha=$GITHUB_SHA&status=success&branch=staging" > /tmp/staging-runs.json
          python -c 'import json,os; runs=json.load(open("/tmp/staging-runs.json"))["workflow_runs"]; assert any(r["head_sha"]==os.environ["GITHUB_SHA"] and r["conclusion"]=="success" for r in runs), "Exact commit has no successful remote staging"'
          python scripts/smoke_release.py https://cftorre1.github.io/Radar-salud/staging/ "$GITHUB_SHA"
  qa:
    needs: staged-release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/qa.yml
  deploy:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve last accepted production artifact
        run: |
          mkdir -p rollback
          git archive origin/production-stable web | tar -x -C rollback
          test -s rollback/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ github.sha }}
          path: rollback/web
          retention-days: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: staging-evidence-${{ github.sha }}
          path: checked
      - name: Stamp exact candidate and preserve staging preview
        run: python scripts/package_pages.py production --accepted rollback/web --checked checked/web --output packaged --sha "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packaged
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify deployed production
        run: python scripts/smoke_release.py '${{ steps.deployment.outputs.page_url }}' "$GITHUB_SHA"
      - name: Save accepted production bytes on a separate branch
        run: |
          git config user.name alicanto-autopilot
          git config user.email alicanto-autopilot@users.noreply.github.com
          cp -R packaged /tmp/accepted-web
          git worktree add /tmp/accepted-production origin/production-stable
          rsync -a --delete /tmp/accepted-web/ /tmp/accepted-production/web/
          git -C /tmp/accepted-production add web
          git -C /tmp/accepted-production diff --cached --quiet || git -C /tmp/accepted-production commit -m "chore: accepted production artifact $GITHUB_SHA"
          git -C /tmp/accepted-production push origin HEAD:production-stable
  rollback:
    needs: deploy
    if: ${{ failure() && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rollback-${{ github.sha }}
          path: rollback
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-rollback
          path: rollback
      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-rollback
        id: restored
      - run: python scripts/smoke_release.py '${{ steps.restored.outputs.page_url }}' --expected-dir rollback
