name: Alicanto autonomy controller
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomy-controller.yml'
      - '.github/workflows/repair-lanes.yml'
      - 'scripts/autonomy_*.py'
  workflow_run:
    workflows: ['Daily Radar pilot', 'Alicanto staging preview', 'Alicanto repair lane']
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
  actions: write
jobs:
  control:
    concurrency:
      group: alicanto-autonomy-controller-plan
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      review_matrix: ${{ steps.plan.outputs.review_matrix }}
      has_reviews: ${{ steps.plan.outputs.has_reviews }}
      failure_run_id: ${{ steps.failure.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: infrastructure
      - uses: actions/checkout@v4
        with:
          ref: staging
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find latest demonstrated staging gate
        id: failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python infrastructure/scripts/autonomy_failure_input.py --repository "$GITHUB_REPOSITORY" --report artifacts/failure.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          failure = json.loads(Path('artifacts/failure.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run_id=' + str(failure.get('run_id', 0)) + '\n')
          PY
      - name: Reconcile leases, material stalls and independent families
        id: plan
        run: python infrastructure/scripts/autonomy_runtime.py plan --infrastructure infrastructure --workspace candidate --failure-json artifacts/failure.json --report artifacts/controller.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomy-controller-${{ github.run_id }}
          path: artifacts
  repair:
    needs: control
    if: needs.control.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.control.outputs.matrix) }}
    uses: ./.github/workflows/repair-lanes.yml
    with:
      family: ${{ matrix.family }}
      failure_run_id: ${{ needs.control.outputs.failure_run_id }}
    secrets: inherit
  candidate_review:
    needs: control
    if: needs.control.outputs.has_reviews == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.control.outputs.review_matrix) }}
    uses: ./.github/workflows/candidate-review.yml
    with:
      family: ${{ matrix.family }}
      task_id: ${{ matrix.task_id }}
      candidate_commit: ${{ matrix.candidate_commit }}
      candidate_branch: ${{ matrix.candidate_branch }}
    secrets: inherit
