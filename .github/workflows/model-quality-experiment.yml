name: Alicanto model quality experiment
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - '.github/run-model-quality-experiment-now'
permissions:
  contents: write
concurrency:
  group: alicanto-model-quality-experiment
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - name: Require API secret and test budget guards
        run: |
          test -n "$OPENAI_API_KEY"
          python -m pytest -q tests/test_model_quality_experiment.py tests/test_openai_runtime_and_committee.py
      - name: Run blinded Luna/Terra/Astra comparison
        run: python scripts/model_quality_experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-quality-blinded-outputs-${{ github.run_id }}
          path: |
            artifacts/model_quality/blinded_outputs.json
            artifacts/model_quality/corpus.json
            artifacts/model_quality/scorecard_template.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-quality-cost-manifest-${{ github.run_id }}
          path: artifacts/model_quality/cost_manifest.json
          if-no-files-found: warn
      - name: Persist actual API usage telemetry to staging
        if: always()
        run: |
          git config user.name alicanto-autopilot
          git config user.email alicanto-autopilot@users.noreply.github.com
          git add data/state/model_usage.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record model comparison API usage"
          git push origin HEAD:staging
