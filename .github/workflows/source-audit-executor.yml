name: Alicanto source audit executor
on:
  workflow_dispatch:
  schedule:
    - cron: '25 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: alicanto-source-audit-wakeup
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Route audit backlog to repair families
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run autonomy-controller.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Dispatched independent repair lanes. Dispatch SUCCESS is not material progress; evidence is in autopilot-state control_v2.json.'
