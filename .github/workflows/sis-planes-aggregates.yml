name: SIS planes aggregates

# Ficha F9 (Benchmark de planes de salud Isapre). Aggregates of SIS open data "Planes de Salud" (t, t-1, t-12) and
# "Cobertura Planes" (t, t-12) into data/sis_planes_aggregates/<yyyymm>/. Same fetcher as the F12/F13 aggregates
# (probe User-Agent, robots.txt fail-closed, cap 1 GiB per file); ZIPs stay in the runner temp dir and are deleted
# after parsing. Only aggregate JSON and receipts (URL, bytes, SHA-256, rows) are committed: never plan-level rows,
# plan identifiers or names.
on:
  push:
    branches: [claude/f9-planes]
    paths:
      - .github/workflows/sis-planes-aggregates.yml
      - scripts/aggregate_sis_planes.py
      - tests/test_aggregate_sis_planes.py
  workflow_dispatch:
    inputs:
      period:
        description: "latest or yyyymm"
        default: latest
        type: string

permissions:
  contents: write

concurrency:
  group: sis-planes-aggregates-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  aggregate:
    if: github.ref_name != 'main' && github.ref_name != 'production-stable' && github.ref_name != 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OUT_ROOT: data/sis_planes_aggregates
      PERIOD: ${{ inputs.period || 'latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (synthetic fixtures)
        run: pip install -q pytest && python -m pytest -q -p no:cacheprovider --noconftest tests/test_aggregate_sis_planes.py
      - name: Aggregate t, t-1 and t-12 (robots.txt honoured)
        run: python scripts/aggregate_sis_planes.py --period "$PERIOD" --output-root "$OUT_ROOT"
      - name: Guard - only small aggregate JSON, no plan identifiers
        run: |
          find "$OUT_ROOT" -type f | sort
          if find "$OUT_ROOT" -type f ! -name '*.json' | grep -q .; then echo "non-JSON file"; exit 1; fi
          if find "$OUT_ROOT" -type f -size +5M | grep -q .; then echo "file too large"; exit 1; fi
          if grep -rl '"id_plan"\s*:\s*"' "$OUT_ROOT"; then echo "plan id value written"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sis-planes-aggregates-${{ github.run_id }}
          path: data/sis_planes_aggregates/
      - name: Commit aggregates and receipts to this branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "alicanto-salud-bot"
          git config user.email "alicanto-salud-bot@users.noreply.github.com"
          git add data/sis_planes_aggregates
          git commit -m "chore: agregados de planes SIS run ${GITHUB_RUN_ID}" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
