name: Alicanto autonomous recovery
on:
  workflow_run:
    workflows: ['Alicanto staging preview']
    branches: [staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      failure_run_id:
        type: string
        required: true
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch fenced recovery family independently
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_RUN_ID: ${{ github.event.workflow_run.id || inputs.failure_run_id }}
        run: |
          case "$FAILURE_RUN_ID" in ''|*[!0-9]*) echo 'Invalid failure run id'; exit 1 ;; esac
          gh workflow run repair-lanes.yml --repo "$GITHUB_REPOSITORY" --ref main -f family=staging_qa -f failure_run_id="$FAILURE_RUN_ID"
          echo 'Recovery dispatched; only a persisted verified result counts as progress.'
