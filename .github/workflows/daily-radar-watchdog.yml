name: Daily Radar watchdog
# Reliability (4-nov-2026): alert when Daily Radar has not published for 14 h, and optionally re-dispatch a slot
# whose primary and backstop crons were both dropped by GitHub's scheduler. See scripts/daily_watchdog.py.
# Re-dispatch is OFF unless the repository variable DAILY_WATCHDOG_DISPATCH is 'true' (Dirección authorization).
# No checkout, no secrets, no AI, no writes to the repository: it only reads the Actions/contents API and, when
# enabled, calls the workflow_dispatch API (GITHUB_TOKEN-dispatched runs do start, unlike other GITHUB_TOKEN events).
on:
  schedule:
    # Hourly at :51 (off-peak; queue uses :15/:45, Daily Radar :30/:07). Scheduled runs use main's copy.
    - cron: '51 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Daily Radar freshness and slot coverage
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Pinned: both scripts are read from $GITHUB_SHA, the commit this workflow runs from.
          for f in should_run.py daily_watchdog.py; do
            gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/scripts/$f?ref=$GITHUB_SHA" > "$RUNNER_TEMP/$f"
          done
          python3 "$RUNNER_TEMP/daily_watchdog.py" --repo "$REPO" | tee -a "$GITHUB_OUTPUT"
      - name: Re-dispatch a missed slot (only when DAILY_WATCHDOG_DISPATCH is 'true')
        if: ${{ steps.check.outputs.dispatch == 'true' && vars.DAILY_WATCHDOG_DISPATCH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh api -X POST "repos/$REPO/actions/workflows/daily-radar.yml/dispatches" -f ref="$DEFAULT_BRANCH"
      - name: Report
        if: always()
        env:
          DISPATCH: ${{ steps.check.outputs.dispatch }}
          DISPATCH_REASON: ${{ steps.check.outputs.dispatch_reason }}
          STALE: ${{ steps.check.outputs.stale }}
          STALE_REASON: ${{ steps.check.outputs.stale_reason }}
          DISPATCH_ENABLED: ${{ vars.DAILY_WATCHDOG_DISPATCH == 'true' }}
        run: |
          {
            echo "### Daily Radar watchdog"
            echo "- Stale (>14 h without a successful build): ${STALE:-unknown} (${STALE_REASON:-n/a})"
            echo "- Slot re-dispatch needed: ${DISPATCH:-unknown} (${DISPATCH_REASON:-n/a}); dispatch enabled: $DISPATCH_ENABLED"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DISPATCH" = true ] && [ "$DISPATCH_ENABLED" != true ]; then
            echo "::warning title=Daily Radar slot missed::$DISPATCH_REASON (re-dispatch disabled; set DAILY_WATCHDOG_DISPATCH=true to enable)"
          fi
          case "$DISPATCH_REASON" in watchdog_error_*|'') echo "::error title=Daily Radar watchdog::cannot evaluate ($DISPATCH_REASON)"; exit 1 ;; esac
          if [ "$STALE" = true ]; then
            echo "::error title=Daily Radar stale::$STALE_REASON - no successful publication for more than 14 h"
            exit 1
          fi
