name: Arancel descriptions
on:
  push:
    branches: [claude/arancel-descripciones]
    paths: [scripts/arancel_descriptions.py, scripts/arancel_codes_wanted.json, .github/workflows/arancel-descripciones.yml]
permissions:
  contents: write
jobs:
  run:
    if: github.ref == 'refs/heads/claude/arancel-descripciones'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/arancel-descripciones}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/arancel_descriptions.py
      - run: |
          git config user.name "alicanto-salud-bot"; git config user.email "alicanto-salud-bot@users.noreply.github.com"
          git add data/audits/arancel_descripciones.json && git commit -m "chore: descripciones del arancel" && git push origin HEAD:claude/arancel-descripciones
