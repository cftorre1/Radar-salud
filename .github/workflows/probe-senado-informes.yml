name: Probe Senado informes (read-only, temporary)

on:
  push:
    branches: [claude/probe-senado]
    paths: [.github/workflows/probe-senado-informes.yml]

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/claude/probe-senado'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public tramitación XML (no secrets, no writes)
        run: |
          mkdir out
          for b in 18255 18832 17765; do
            curl -sS --max-time 60 -A "AlicantoSalud/1.0 (+https://alicantosalud.cl)" "https://tramitacion.senado.cl/wspublico/tramitacion.php?boletin=$b" -o out/$b.xml || true
            python3 - "$b" <<'PY'
          import sys,re
          b=sys.argv[1];t=open(f"out/{b}.xml",encoding="latin-1",errors="replace").read()
          m=re.search(r"<informes>.*?</informes>",t,re.S)
          print("==",b,len(t));print((m.group(0) if m else "NO INFORMES")[:3000])
          PY
          done
      - name: Fetch one informe document (type and first text)
        run: |
          curl -sS -L --max-time 90 -A "AlicantoSalud/1.0 (+https://alicantosalud.cl)" -D out/head.txt "https://tramitacion.senado.cl/appsenado/index.php?mo=tramitacion&ac=getDocto&iddocto=28246&tipodoc=info" -o out/doc.bin || true
          head -30 out/head.txt; ls -l out/doc.bin; file out/doc.bin
          pip install -q pypdf python-docx >/dev/null 2>&1 || true
          python3 - <<'PY'
          import io
          b=open("out/doc.bin","rb").read()
          if b[:4]==b"%PDF":
              from pypdf import PdfReader
              r=PdfReader(io.BytesIO(b));print("PDF pages",len(r.pages));print(r.pages[0].extract_text()[:1500]);print("...LAST...",r.pages[-1].extract_text()[-1500:])
          elif b[:2]==b"PK":
              import docx;d=docx.Document(io.BytesIO(b));t="\n".join(p.text for p in d.paragraphs);print("DOCX chars",len(t));print(t[:1500]);print("...LAST...",t[-1500:])
          else:
              print(b[:800])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: senado-informes
          path: out/
