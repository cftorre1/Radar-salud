name: Occupational public-source recovery

on:
  push:
    branches: [codex/e-salud-laboral-20261011]
    paths:
      - .github/workflows/occupational-source-recovery.yml
      - scripts/occupational_access_probe.py
      - scripts/occupational_inventory.py
      - config/occupational_recovery_routes.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alicanto-staging-writer
  cancel-in-progress: false

jobs:
  public-origin-capture:
    if: github.ref == 'refs/heads/codex/e-salud-laboral-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e-salud-laboral-20261011
      - name: Record actual isolated candidate after waiting for the shared writer
        run: printf 'CANDIDATE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture official surfaces without executing WAF challenges
        run: |
          python scripts/occupational_access_probe.py --environment github_actions --output "data/audits/source_e_recovery/actions/${GITHUB_RUN_ID}" --targets-json config/occupational_recovery_routes.json
      - name: Persist origin checkpoint before source inventories
        run: |
          test "$GITHUB_REF" = refs/heads/codex/e-salud-laboral-20261011
          git config user.name 'Alicanto source evidence'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/audits/source_e_recovery/actions/${GITHUB_RUN_ID}"
          git commit -m "audit(occupational): origin checkpoint ${GITHUB_RUN_ID}"
          git pull --rebase origin codex/e-salud-laboral-20261011
          git push origin HEAD:codex/e-salud-laboral-20261011
          printf 'CANDIDATE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Observe the public Mutual pagination interface
        if: hashFiles('scripts/mutual_public_paging_probe.py') != ''
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/mutual_public_paging_probe.py --output "data/audits/source_e_recovery/actions/${GITHUB_RUN_ID}/mutual_browser" --as-of 2026-10-11
          python scripts/mutual_public_paging_probe.py --output "data/audits/source_e_recovery/actions/${GITHUB_RUN_ID}/mutual_browser_worker" --as-of 2026-10-11 --listing-url https://www.mutual.cl/portal/publico/trabajador/home/nuestra-mutual/noticias
      - name: Build complete scoped inventories and reconcile durable decisions
        if: hashFiles('scripts/occupational_inventory.py') != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_FAST_MODEL: gpt-5.6-luna
          RADAR_FAST_PER_RUN: 30
          RADAR_FAST_PER_MONTH: 1500
          RADAR_DEEP_PER_RUN: 0
        run: |
          pip install -e .
          git fetch origin staging
          git show FETCH_HEAD:data/ai_usage/$(date -u +%Y-%m).json > /tmp/occupational-staging-ai-usage.json
          python scripts/occupational_inventory.py --sync-budget /tmp/occupational-staging-ai-usage.json
          python scripts/occupational_inventory.py --output "data/audits/source_e_recovery/actions/${GITHUB_RUN_ID}/inventory" --capture-cache-latest --apply --checkpoint-commits
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occupational-public-origin-${{ github.run_id }}
          path: data/audits/source_e_recovery/actions/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
      - name: Persist public capture on the authorized isolated branch
        if: always()
        run: |
          test "$GITHUB_REF" = refs/heads/codex/e-salud-laboral-20261011
          git config user.name 'Alicanto source evidence'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/audits/source_e_recovery/actions/${GITHUB_RUN_ID}"
          for file in data/state/pending_queue.json data/state/occupational_source_discovery.json data/history/superintendencia_signals.json data/source_health.json web/data/source_health.json web/data/product.json web/data/radar_today.json; do
            if test -f "$file"; then git add "$file"; fi
          done
          if test -d data/ai_usage; then git add data/ai_usage; fi
          if test -d data/telemetry; then git add data/telemetry; fi
          if ! git diff --cached --quiet; then
            git commit -m "audit(occupational): capture public origins in Actions ${GITHUB_RUN_ID}"
          fi
          git pull --rebase origin codex/e-salud-laboral-20261011
          git push origin HEAD:codex/e-salud-laboral-20261011
