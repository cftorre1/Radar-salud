name: Fiscalization isolated native runtime
on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fiscalization-recovery.yml'
      - 'scripts/probe_fiscalization_runtime.py'
      - 'scripts/replay_fiscalization_runtime.py'
      - 'config/fiscalization_editorial_reviews.json'
      - 'src/radar_salud/*fiscalizacion.py'
      - 'tests/test_fiscalization_runtime.py'
permissions:
  contents: read
jobs:
  native-probe:
    if: github.head_ref == 'codex/d-fiscalizacion-sis-suseso-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Native HTTP, TLS, listings and all recent primary documents
        run: python scripts/probe_fiscalization_runtime.py --as-of 2026-10-11
      - name: Real collectors and engine, isolated state, idempotent native replay
        run: python scripts/replay_fiscalization_runtime.py --captures artifacts/fiscalization-runtime --output artifacts/fiscalization-runtime/isolated-replay
      - name: Independent original HTML coverage Reviewer
        run: python scripts/review_fiscalization_coverage.py --runtime artifacts/fiscalization-runtime --output artifacts/fiscalization-runtime/coverage-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscalization-runtime-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/fiscalization-runtime/
            !artifacts/fiscalization-runtime/**/*.pdf
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscalization-documents-0-${{ github.event.pull_request.head.sha }}
          path: artifacts/fiscalization-runtime/captures/documents/0/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscalization-documents-1-${{ github.event.pull_request.head.sha }}
          path: artifacts/fiscalization-runtime/captures/documents/1/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscalization-documents-2-${{ github.event.pull_request.head.sha }}
          path: artifacts/fiscalization-runtime/captures/documents/2/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscalization-documents-3-${{ github.event.pull_request.head.sha }}
          path: artifacts/fiscalization-runtime/captures/documents/3/
          retention-days: 30
