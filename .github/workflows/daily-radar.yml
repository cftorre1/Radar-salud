name: Daily Radar pilot
on:
  push:
    branches: [staging]
    paths:
      - '.github/run-daily-radar-now'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Reconstruir fuentes usando cache de análisis'
        required: false
        default: false
        type: boolean
      processing_limit:
        description: 'Máximo procesado; 0 usa 200 (con presupuesto de 60 min y USD 10/mes)'
        required: false
        default: 0
        type: number
  schedule:
    # Dirección 27-oct-2026: discover four times a day, every day (07:30, 11:30, 15:30, 19:30 Chile);
    # the hourly queue batch processes what is found in between.
    - cron: '30 10,14,18,22 * * *'
    # Backstop (Dirección 28-oct): ~97 min after each slot; the gate runs it only if that slot's
    # discovery never happened (a late primary run is skipped the same way). Never two per slot.
    - cron: '7 0,12,16,20 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: alicanto-staging-writer
  cancel-in-progress: false
jobs:
  gate:
    # Scheduler backstop (Dirección 28-oct "Respaldo en GitHub"): cheap no-checkout gate, see scripts/should_run.py.
    # If the gate cannot run: primary crons, manual and push runs fail OPEN (run=true); the backstop crons
    # ('45 0-9,11-13,15-17,19-21,23 * * *', '7 0,12,16,20 * * *') fail CLOSED (run=false).
    # Pinned: should_run.py is read from $GITHUB_SHA, the commit this workflow runs from (main for schedules),
    # never from a moving branch. To update it: change it on staging with tests, then copy scripts/should_run.py
    # and tests/test_should_run.py byte-identical to main in a reviewed PR.
    # Known, accepted risk: check-then-act race (state can change between the gate and the writer job);
    # the alicanto-staging-writer group still serialises writers, so the worst case is one redundant run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Gate (daily)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '45 0-9,11-13,15-17,19-21,23 * * *'|'7 0,12,16,20 * * *') fallback=$'run=false\nreason=gate_unavailable_backstop' ;;
            *) fallback=$'run=true\nreason=gate_unavailable' ;;
          esac
          if gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/scripts/should_run.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/should_run.py" \
            && out=$(python3 "$RUNNER_TEMP/should_run.py" daily --repo "$REPO" --event "$EVENT" --run-id "$RUN_ID" --schedule "$SCHEDULE") \
            && grep -qx 'run=true\|run=false' <<<"$out"; then :
          else out=$fallback; fi
          echo "$out" | tee -a "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RADAR_FAST_MODEL: gpt-5.6-luna
      RADAR_DEEP_MODEL: gpt-5.6-terra
      # Store official text of recent normative acts as evidence (no AI).
      RADAR_CAPTURE_EVIDENCE: '1'
      # Dirección 27-oct-2026: the real limit is USD 10/month of AI spend (ai_pricing),
      # not call counts; counts stay as loose safety rails.
      RADAR_MONTHLY_USD: 10
      RADAR_DEEP_PER_RUN: 40
      RADAR_FAST_PER_RUN: 400
      RADAR_DEEP_PER_MONTH: 1000
      RADAR_FAST_PER_MONTH: 20000
      # Batches: stop taking new items after 60 min; the rest waits for the next run.
      RADAR_PROCESSING_SECONDS: 3600
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e . pytest
      - name: Core deterministic tests before collection
        # Failing test names surface as annotations (job logs are not readable from the orchestrator).
        run: |
          set +e
          python -m pytest -q -rfE --ignore=tests/test_reviewer.py --ignore=tests/test_beta_source_runtime_fast.py 2>&1 | tee "$RUNNER_TEMP/core-tests.txt"
          rc=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/core-tests.txt" | head -20 | sed 's/^/::error title=Core test::/'
          grep -E '^E  ' "$RUNNER_TEMP/core-tests.txt" | head -10 | sed 's/^/::error title=Core test detail::/'
          exit $rc
      - name: Preserve paid Terra analyses
        run: python scripts/seed_analysis_cache.py
      - name: Run incremental collectors
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rebuild != true }}
        env:
          RADAR_DAILY_WINDOW_DAYS: 30
          REQUESTED_LIMIT: ${{ inputs.processing_limit || 200 }}
        run: |
          limit=$(python -c 'import os; n=int(os.environ["REQUESTED_LIMIT"]); print(n if 1 <= n <= 400 else 200)')
          timeout --signal=TERM 90m python -m radar_salud.engine_cli --limit "$limit"
      - name: Controlled rebuild using cache and persistent pending queue
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild == true }}
        env:
          REQUESTED_LIMIT: ${{ inputs.processing_limit || 200 }}
        run: |
          limit=$(python -c 'import os; n=int(os.environ["REQUESTED_LIMIT"]); print(n if 1 <= n <= 400 else 200)')
          timeout --signal=TERM 90m python -m radar_salud.engine_cli --limit "$limit"
      # Dirección 28-oct-2026: PASS publishes, FAIL holds (data/stats_fichas/POLICY.md).
      - name: Statistics fichas
        continue-on-error: true
        run: python scripts/run_stats_fichas.py
      - name: Export public snapshot and source health
        run: python scripts/export_web_snapshot.py --input data/history/superintendencia_signals.json
      - name: Live beta source validation (degrades beta, never blocks core)
        id: beta_validation
        continue-on-error: true
        run: python -m pytest -q tests/test_beta_source_runtime_fast.py
      - name: Record beta validation status
        if: always()
        run: |
          echo "### Live beta validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: ${{ steps.beta_validation.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Beta source failures remain repair-required but do not suppress independent core collection." >> "$GITHUB_STEP_SUMMARY"
      - name: Snapshot reviewer after collection
        run: python -m pytest -q tests/test_reviewer.py
      - name: Observe Global snapshot freshness without collecting or publishing
        if: always()
        continue-on-error: true
        env:
          OPENAI_API_KEY: ''
        run: python scripts/check_global_source_freshness.py --output "data/audits/global_integration_2026_10_11/freshness/${GITHUB_RUN_ID}.json"
      - name: Read explicit Global daily activation policy
        id: global_policy
        if: always()
        run: python -c 'import json; c=json.load(open("config/global_discovery.json")); print("enabled=" + ("true" if c.get("daily_collection_enabled") is True else "false"))' >> "$GITHUB_OUTPUT"
      - name: Independent Global metadata discovery (no paid AI or publication)
        id: global_discovery
        if: ${{ always() && steps.global_policy.outputs.enabled == 'true' }}
        continue-on-error: true
        timeout-minutes: 50
        env:
          OPENAI_API_KEY: ''
        run: python scripts/discover_global_sources.py
      - name: Preserve Global discovery health after independent core exports
        if: ${{ always() && steps.global_discovery.outcome == 'success' }}
        run: python scripts/discover_global_sources.py --mirror-health
      # Dirección 29-oct-2026 authorized budgeted Spanish translation/summaries of Global items (two-layer check).
      - name: Licensed Global feed metadata + rights-gated Spanish translation (budgeted; no publication)
        if: ${{ always() && steps.global_policy.outputs.enabled == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/discover_global_feeds.py
      - name: Preserve queue, paid usage and checkpoints on failure
        if: always()
        run: |
          git config user.name "alicanto-salud-bot"
          git config user.email "alicanto-salud-bot@users.noreply.github.com"
          git add data/state data/history data/analysis_cache data/ai_usage data/source_health.json data/inbox data/outbox
          # Dirección 27-oct-2026: CMF and SIS-isapres are daily sources; keep their captured data.
          git add data/market data/entities
          # Statistics fichas (Dirección 28-oct-2026); guarded so either merge order keeps this step green.
          [ -d data/stats_fichas ] && git add data/stats_fichas
          git add data/global_intelligence data/audits/global_source_recovery_2026_10_11/runs web/data/source_health.json web/data/product.json
          git add data/audits/global_integration_2026_10_11
          if [ "${{ job.status }}" = success ]; then git add web/data; fi
          git diff --cached --quiet || git commit -m "chore: refresh Alicanto Salud"
          # Retry with rebase: a staging merge during the run must not lose queue state or the AI ledger.
          for attempt in 1 2 3; do
            git pull --rebase origin staging && git push origin HEAD:staging && break
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 20))
          done
          git push --dry-run origin HEAD:staging
      - name: Request checked staging preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run staging-preview.yml --ref staging
