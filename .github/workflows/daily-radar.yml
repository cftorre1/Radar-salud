name: Daily Radar pilot
on:
  push:
    branches: [staging]
    paths:
      - '.github/run-daily-radar-now'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Reconstruir fuentes usando cache de análisis'
        required: false
        default: false
        type: boolean
      processing_limit:
        description: 'Máximo procesado; 0 usa 30 normal o 40 reconstrucción'
        required: false
        default: 0
        type: number
  schedule:
    - cron: '30 9 * * 1-5'
permissions:
  contents: write
  actions: write
concurrency:
  group: alicanto-staging-writer
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RADAR_FAST_MODEL: gpt-5.6-luna
      RADAR_DEEP_MODEL: gpt-5.6-terra
      RADAR_DEEP_PER_RUN: 15
      RADAR_FAST_PER_RUN: 120
      RADAR_DEEP_PER_MONTH: 180
      RADAR_FAST_PER_MONTH: 1500
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e . pytest
      - name: Core deterministic tests before collection
        run: python -m pytest -q --ignore=tests/test_reviewer.py --ignore=tests/test_beta_source_runtime_fast.py
      - name: Preserve paid Terra analyses
        run: python scripts/seed_analysis_cache.py
      - name: Run incremental collectors
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rebuild != true }}
        env:
          RADAR_DAILY_WINDOW_DAYS: 30
          REQUESTED_LIMIT: ${{ inputs.processing_limit || 30 }}
        run: |
          limit=$(python -c 'import os; n=int(os.environ["REQUESTED_LIMIT"]); print(n if 1 <= n <= 30 else 30)')
          timeout --signal=TERM 45m python -m radar_salud.engine_cli --limit "$limit"
      - name: Controlled rebuild using cache and persistent pending queue
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild == true }}
        env:
          REQUESTED_LIMIT: ${{ inputs.processing_limit || 40 }}
        run: |
          limit=$(python -c 'import os; n=int(os.environ["REQUESTED_LIMIT"]); print(n if 1 <= n <= 40 else 40)')
          timeout --signal=TERM 45m python -m radar_salud.engine_cli --limit "$limit"
      - name: Export public snapshot and source health
        run: python scripts/export_web_snapshot.py --input data/history/superintendencia_signals.json
      - name: Live beta source validation (degrades beta, never blocks core)
        id: beta_validation
        continue-on-error: true
        run: python -m pytest -q tests/test_beta_source_runtime_fast.py
      - name: Record beta validation status
        if: always()
        run: |
          echo "### Live beta validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: ${{ steps.beta_validation.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Beta source failures remain repair-required but do not suppress independent core collection." >> "$GITHUB_STEP_SUMMARY"
      - name: Snapshot reviewer after collection
        run: python -m pytest -q tests/test_reviewer.py
      - name: Observe Global snapshot freshness without collecting or publishing
        if: always()
        continue-on-error: true
        env:
          OPENAI_API_KEY: ''
        run: python scripts/check_global_source_freshness.py --output "data/audits/global_integration_2026_10_11/freshness/${GITHUB_RUN_ID}.json"
      - name: Read explicit Global daily activation policy
        id: global_policy
        if: always()
        run: python -c 'import json; c=json.load(open("config/global_discovery.json")); print("enabled=" + ("true" if c.get("daily_collection_enabled") is True else "false"))' >> "$GITHUB_OUTPUT"
      - name: Independent Global metadata discovery (no paid AI or publication)
        id: global_discovery
        if: ${{ always() && steps.global_policy.outputs.enabled == 'true' }}
        continue-on-error: true
        timeout-minutes: 50
        env:
          OPENAI_API_KEY: ''
        run: python scripts/discover_global_sources.py
      - name: Preserve Global discovery health after independent core exports
        if: ${{ always() && steps.global_discovery.outcome == 'success' }}
        run: python scripts/discover_global_sources.py --mirror-health
      - name: Preserve queue, paid usage and checkpoints on failure
        if: always()
        run: |
          git config user.name "alicanto-salud-bot"
          git config user.email "alicanto-salud-bot@users.noreply.github.com"
          git add data/state data/history data/analysis_cache data/ai_usage data/source_health.json data/inbox data/outbox
          git add data/global_intelligence data/audits/global_source_recovery_2026_10_11/runs web/data/source_health.json web/data/product.json
          git add data/audits/global_integration_2026_10_11
          if [ "${{ job.status }}" = success ]; then git add web/data; fi
          git diff --cached --quiet || git commit -m "chore: refresh Alicanto Salud"
          git push origin HEAD:staging
      - name: Request checked staging preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run staging-preview.yml --ref staging
