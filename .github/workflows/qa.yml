name: Alicanto critical QA
on:
  pull_request:
    branches: [main, staging]
  workflow_call:
permissions:
  contents: read
jobs:
  # tests, staging (build + Playwright) and reviewer keep their names: /home/claude/merge_when_ready.sh and the PR
  # checks wait for exactly these. tests and staging run in parallel; reviewer waits for both (it is the last check).
  tests:
    runs-on: ubuntu-24.04
    # The integrated suite includes immutable paid-history replays (3800+ cases): ~24 min serial in Nov-2026.
    # It now runs with pytest-xdist on the 4 runner vCPUs (nov-2026 audit: no flock, writes under tmp_path,
    # only read-only git on the shared .git). Headroom kept in case xdist has to be reverted.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . pytest pytest-xdist==3.6.1 pyyaml
      - name: python -m pytest -q -n auto
        # Failing test names surface as check-run annotations (Actions logs are not readable from the agent environment).
        # The two CI-only network tests that write ::notice annotations to the real stdout (capsys.disabled) run in the
        # next step without xdist: worker stdout never reaches the job log, so their annotations would be lost.
        # PYTHONHASHSEED is pinned so every xdist worker collects the same parametrized ids (some are built from set
        # iteration order; with a per-process random seed workers disagreed: "Different tests were collected").
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -o pipefail
          python -m pytest -q -rfE -n auto --durations=15 \
            --ignore=tests/test_stats_ficha_f2_real_xls.py --ignore=tests/test_stats_fichas_f6_real_pdf.py \
            2>&1 | tee "$RUNNER_TEMP/pytest.log" || {
            grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/pytest.log" | head -20 | while IFS= read -r l; do echo "::error title=pytest::${l}"; done
            grep -E '^E  ' "$RUNNER_TEMP/pytest.log" | head -15 | while IFS= read -r l; do echo "::error title=pytest-detail::${l}"; done
            exit 1; }
      - name: python -m pytest -q (annotation tests, serial)
        run: |
          set -o pipefail
          python -m pytest -q -rfE -p no:xdist tests/test_stats_ficha_f2_real_xls.py tests/test_stats_fichas_f6_real_pdf.py \
            2>&1 | tee "$RUNNER_TEMP/pytest-serial.log" || {
            grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/pytest-serial.log" | head -20 | while IFS= read -r l; do echo "::error title=pytest::${l}"; done
            grep -E '^E  ' "$RUNNER_TEMP/pytest-serial.log" | head -15 | while IFS= read -r l; do echo "::error title=pytest-detail::${l}"; done
            exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test
  staging:
    # Independent of tests (no shared outputs): it builds the candidate web/ and runs Playwright in parallel.
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Load durable iteration ledger
        run: |
          mkdir -p data/autopilot
          if git ls-remote --exit-code --heads origin autopilot-state >/dev/null; then
            git fetch origin autopilot-state
            if git cat-file -e FETCH_HEAD:data/autopilot/ledger.json 2>/dev/null; then
              git show FETCH_HEAD:data/autopilot/ledger.json > data/autopilot/ledger.json
            fi
          fi
      - name: Build priority statistical deep analysis
        run: python scripts/build_statistics_deep_analysis.py
      - name: Build fresh material epidemiology signal
        run: python scripts/build_epidemiology_snapshot.py
      - name: Recurate current history without external lookups
        run: python scripts/export_web_snapshot.py --input data/history/superintendencia_signals.json --offline
      - name: Validate and export the canonical Global Intelligence sample
        run: python scripts/export_global_intelligence.py
      - run: python scripts/product_report.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reuse cached Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-24.04-${{ hashFiles('package-lock.json') }}
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Build dated browser fixture (published web/ is not modified)
        run: |
          rm -rf "$RUNNER_TEMP/fixture-web" && cp -R web "$RUNNER_TEMP/fixture-web"
          python scripts/export_web_snapshot.py --input data/history/superintendencia_signals.json --offline --as-of 2026-10-12 --output "$RUNNER_TEMP/fixture-web/data/radar_today.json"
      - run: npm run test:browser -- --reporter=line,github
        env:
          ALICANTO_BROWSER_WEB: ${{ runner.temp }}/fixture-web
          ALICANTO_FIXTURE_AS_OF: '2026-10-12'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence-${{ github.sha }}
          path: |
            artifacts/
            test-results/
            web/
  reviewer:
    needs: [tests, staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: staging-evidence-${{ github.sha }}
          path: reviewed
      - run: python scripts/review_candidate.py --web reviewed/web --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-${{ github.sha }}
          path: artifacts/review.json
