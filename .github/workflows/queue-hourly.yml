name: Queue hourly batch
# Dirección 27-oct-2026: process the pending queue every hour so news reaches the
# feed the same day, instead of long once-a-day batches. No discovery here (the
# Daily Radar runs discover); same AI guardrails (USD 10/month) and same gates.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  # Shared with Daily Radar: never two writers on staging at the same time.
  group: alicanto-staging-writer
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RADAR_FAST_MODEL: gpt-5.6-luna
      RADAR_DEEP_MODEL: gpt-5.6-terra
      RADAR_CAPTURE_EVIDENCE: '1'
      RADAR_MONTHLY_USD: 10
      RADAR_DEEP_PER_RUN: 40
      RADAR_FAST_PER_RUN: 400
      RADAR_DEEP_PER_MONTH: 1000
      RADAR_FAST_PER_MONTH: 20000
      RADAR_DAILY_WINDOW_DAYS: 30
      RADAR_PROCESSING_SECONDS: 1800
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e . pytest
      - name: Skip when nothing is pending inside the 30-day window
        id: work
        run: python scripts/queue_backlog.py --github-output >> "$GITHUB_OUTPUT"
      - name: Preserve paid Terra analyses
        if: steps.work.outputs.pending != '0'
        run: python scripts/seed_analysis_cache.py
      - name: Process pending queue (no discovery)
        if: steps.work.outputs.pending != '0'
        run: timeout --signal=TERM 40m python -m radar_salud.engine_cli --process-only --limit 120
      - name: Export public snapshot
        if: steps.work.outputs.pending != '0'
        run: python scripts/export_web_snapshot.py --input data/history/superintendencia_signals.json
      - name: Snapshot reviewer and web contract
        if: steps.work.outputs.pending != '0'
        run: python -m pytest -q tests/test_reviewer.py
      - name: Commit queue, history and snapshot
        if: always() && steps.work.outputs.pending != '0'
        run: |
          git config user.name "alicanto-salud-bot"
          git config user.email "alicanto-salud-bot@users.noreply.github.com"
          git add data/state data/history data/analysis_cache data/ai_usage
          if [ "${{ job.status }}" = success ]; then git add web/data; fi
          git diff --cached --quiet || git commit -m "chore: hourly queue batch"
          git push origin HEAD:staging
      - name: Request checked staging preview
        if: success() && steps.work.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run staging-preview.yml --ref staging
