name: Source expansion isolated native validation
on:
  pull_request:
    branches: [staging]
  workflow_dispatch:
    inputs:
      capture_fresh:
        description: 'Explicit fresh public capture; PRs always reuse retained evidence'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  native:
    if: github.head_ref == 'codex/w4-market-intelligence-expansion-20261011' || github.ref == 'refs/heads/codex/w4-market-intelligence-expansion-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - name: Source-specific positive and adversarial tests
        run: python -m pytest -q tests/test_source_expansion_*.py
      - name: Public scanned issuer documents
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - name: Capture official public surfaces with verified TLS
        if: github.event_name == 'workflow_dispatch' && inputs.capture_fresh
        run: python scripts/probe_source_expansion.py --output artifacts/expansion
      - name: Reuse hash-verified official captures without source requests
        if: github.event_name != 'workflow_dispatch' || !inputs.capture_fresh
        run: python scripts/prepare_market_source_replay.py --output artifacts/expansion
      - name: Execute adapters, replay retained stock and reconcile originals independently
        run: python scripts/validate_market_source_runtime.py --capture-dir artifacts/expansion --output artifacts/qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-runtime-review
          path: |
            artifacts/qualification
            artifacts/replay_preparation.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-native-indexes
          path: |
            artifacts/expansion/receipts.json
            artifacts/expansion/captures/*.body
            artifacts/expansion/captures/*.headers
            artifacts/expansion/captures/*.tls.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-documents-0
          path: artifacts/expansion/captures/documents/0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-documents-1
          path: artifacts/expansion/captures/documents/1
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-documents-2
          path: artifacts/expansion/captures/documents/2
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-documents-3
          path: artifacts/expansion/captures/documents/3
          retention-days: 14
