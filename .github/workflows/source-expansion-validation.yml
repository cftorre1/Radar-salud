name: Source expansion isolated native validation
on:
  pull_request:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.head_ref == 'codex/w4-market-intelligence-expansion-20261011' || github.ref == 'refs/heads/codex/w4-market-intelligence-expansion-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - name: Capture official public surfaces with verified TLS
        run: python scripts/probe_source_expansion.py --output artifacts/expansion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-native-indexes
          path: |
            artifacts/expansion/receipts.json
            artifacts/expansion/captures/*.body
            artifacts/expansion/captures/*.headers
            artifacts/expansion/captures/*.tls.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-documents-0
          path: artifacts/expansion/captures/documents/0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-documents-1
          path: artifacts/expansion/captures/documents/1
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-documents-2
          path: artifacts/expansion/captures/documents/2
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-documents-3
          path: artifacts/expansion/captures/documents/3
          retention-days: 14
