name: Pulso isolated review evidence transport
on:
  push:
    branches: [codex/b-pulso-runtime-20261011]
    paths:
      - '.github/run-pulso-review-transport-now'
      - '.github/workflows/pulso-review-transport.yml'
      - 'scripts/pulso_review_transport.py'
permissions:
  contents: write
concurrency:
  group: pulso-isolated-review-transport
  cancel-in-progress: false
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b-pulso-runtime-20261011
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert exclusive isolated branch
        run: test "$GITHUB_REF" = refs/heads/codex/b-pulso-runtime-20261011
      - run: pip install pytest
      - name: Verify real bundle reconstruction and tamper rejection offline
        run: python -m pytest -q tests/test_pulso_review_transport.py
      - name: Capture latest tracked branch HEAD as bounded review chunks
        run: python scripts/pulso_review_transport.py --create --marker .github/run-pulso-review-transport-now
      - name: Reconstruct and verify captured Git objects before preservation
        run: python scripts/pulso_review_transport.py --assemble work/pulso-review-transport --bundle-out .scratch/pulso-review.bundle --verify-repo .
      - name: Preserve transport only on the authorized isolated branch
        run: |
          test "$GITHUB_REF" = refs/heads/codex/b-pulso-runtime-20261011
          git config user.name alicanto-salud-bot
          git config user.email alicanto-salud-bot@users.noreply.github.com
          git add -- work/pulso-review-transport
          git diff --cached --quiet || git commit -m "audit(pulso): preserve incremental review evidence transport [skip ci]"
          git fetch origin codex/b-pulso-runtime-20261011
          git rebase origin/codex/b-pulso-runtime-20261011
          git push origin HEAD:codex/b-pulso-runtime-20261011
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulso-review-transport-${{ github.sha }}
          retention-days: 90
          path: work/pulso-review-transport/
          if-no-files-found: error
