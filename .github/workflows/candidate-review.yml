name: Alicanto independent candidate review
on:
  workflow_dispatch:
    inputs:
      family:
        type: choice
        required: true
        options: [media, public_data, fiscalization, mutualities, editorial, staging_qa]
      task_id:
        type: string
        required: true
      candidate_commit:
        type: string
        required: true
      candidate_branch:
        type: string
        required: true
  workflow_call:
    inputs:
      family:
        type: string
        required: true
      task_id:
        type: string
        required: true
      candidate_commit:
        type: string
        required: true
      candidate_branch:
        type: string
        required: true
permissions:
  contents: write
  actions: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: alicanto-candidate-review-${{ inputs.task_id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPAIR_FAMILY: ${{ inputs.family }}
      TASK_ID: ${{ inputs.task_id }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: infrastructure
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_branch }}
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify recorded authority before executing candidate code
        run: |
          python - <<'PY'
          import sys, os
          from pathlib import Path
          sys.path.insert(0, str(Path('infrastructure/scripts').resolve()))
          from autonomy_state_store import GitStateStore
          from autonomy_candidate_review import recorded_candidate, validate_checkout, STATE
          state = GitStateStore(repository='infrastructure').read_snapshot().read_json(STATE, {})
          task, event, latest = recorded_candidate(state, os.environ['TASK_ID'], os.environ['REPAIR_FAMILY'], os.environ['CANDIDATE_COMMIT'])
          validate_checkout(Path('candidate').resolve(), os.environ['CANDIDATE_COMMIT'], event['details']['candidate_branch'])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing QA dependencies
        run: |
          python -m pip install -e ./candidate pytest
          if [ -f candidate/package-lock.json ]; then
            npm ci --prefix candidate
            (cd candidate && npx playwright install --with-deps chromium)
          fi
      - name: Independently evaluate the pinned repair candidate
        run: python infrastructure/scripts/autonomy_candidate_review.py --infrastructure infrastructure --workspace candidate --task-id "$TASK_ID" --family "$REPAIR_FAMILY" --candidate-commit "$CANDIDATE_COMMIT" --report artifacts/candidate-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-review-${{ inputs.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Continue independent approved tasks
        if: always()
        run: gh workflow run autonomy-controller.yml --repo "$GITHUB_REPOSITORY" --ref main
