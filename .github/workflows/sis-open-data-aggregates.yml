name: SIS open data aggregates

# Dirección 5-nov-2026: first aggregation pipeline on SIS open data (Prestaciones Bonificadas, Licencias Médicas).
# Runs only on its own branch; never touches staging data. Downloads stay in the runner temp dir; only aggregate JSON
# and receipts (URL, bytes, SHA-256, row counts) are committed back to this branch.
on:
  push:
    branches: [claude/sis-open-data-aggregates]
    paths:
      - .github/workflows/sis-open-data-aggregates.yml
      - scripts/aggregate_sis_open_data.py

permissions:
  contents: write

concurrency:
  group: sis-open-data-aggregates
  cancel-in-progress: false

jobs:
  aggregate:
    if: github.ref == 'refs/heads/claude/sis-open-data-aggregates'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OUT: data/sis_open_data_aggregates/2026t2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/sis-open-data-aggregates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (synthetic fixtures)
        run: pip install -q pytest && python -m pytest -q -p no:cacheprovider --noconftest tests/test_aggregate_sis_open_data.py
      - name: Licencias Médicas 2026t2 (robots.txt honoured)
        continue-on-error: true
        run: python scripts/aggregate_sis_open_data.py --period 2026t2 --previous "" --only licencias --output-dir "$OUT"
      - name: Prestaciones Bonificadas 2026t2 + IDs 2026t1 (robots.txt honoured)
        continue-on-error: true
        run: python scripts/aggregate_sis_open_data.py --period 2026t2 --previous 2026t1 --only prestaciones --output-dir "$OUT"
      - name: Guard - only small aggregate JSON
        run: |
          ls -la "$OUT" || true
          if find "$OUT" -type f ! -name '*.json' | grep -q .; then echo "non-JSON file"; exit 1; fi
          if find "$OUT" -type f -size +40M | grep -q .; then echo "file too large"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sis-open-data-aggregates-${{ github.run_id }}
          path: data/sis_open_data_aggregates/
      - name: Commit aggregates and receipts to this branch only
        run: |
          git config user.name "alicanto-salud-bot"
          git config user.email "alicanto-salud-bot@users.noreply.github.com"
          git add data/sis_open_data_aggregates
          git commit -m "chore: agregados datos abiertos SIS run ${GITHUB_RUN_ID}" || exit 0
          git pull --rebase origin claude/sis-open-data-aggregates
          git push origin HEAD:claude/sis-open-data-aggregates
