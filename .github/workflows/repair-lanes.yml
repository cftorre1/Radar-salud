name: Alicanto repair lane
on:
  workflow_dispatch:
    inputs:
      family:
        type: choice
        required: true
        options: [media, public_data, fiscalization, mutualities, editorial, staging_qa]
      failure_run_id:
        type: string
        default: '0'
  workflow_call:
    inputs:
      family:
        type: string
        required: true
      failure_run_id:
        type: string
        default: '0'
permissions:
  contents: write
  actions: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: alicanto-repair-${{ inputs.family }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RADAR_REPAIR_MODEL: ${{ vars.RADAR_REPAIR_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: infrastructure
      - uses: actions/checkout@v4
        with:
          ref: staging
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing project and validation dependencies
        run: |
          python -m pip install -e ./candidate pytest
          if [ -f candidate/package-lock.json ]; then
            npm ci --prefix candidate
            (cd candidate && npx playwright install --with-deps chromium)
          fi
      - name: Capture demonstrated failure input
        env:
          FAILURE_RUN_ID: ${{ inputs.failure_run_id }}
        run: |
          python infrastructure/scripts/autonomy_failure_input.py --repository "$GITHUB_REPOSITORY" --run-id "$FAILURE_RUN_ID" --report artifacts/failure.json
      - name: Lease, heartbeat, execute, persist evidence and transition
        env:
          REPAIR_FAMILY: ${{ inputs.family }}
        run: python infrastructure/scripts/autonomy_runtime.py execute --infrastructure infrastructure --workspace candidate --family "$REPAIR_FAMILY" --failure-json artifacts/failure.json --report artifacts/worker.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomy-${{ inputs.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Continue independent work immediately
        if: always()
        run: gh workflow run autonomy-controller.yml --repo "$GITHUB_REPOSITORY" --ref main
