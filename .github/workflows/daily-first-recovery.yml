name: Daily First bounded public recovery
on:
  pull_request:
    branches: [staging]
    paths:
      - 'scripts/daily_first_runtime.py'
      - 'src/radar_salud/daily_first.py'
      - 'src/radar_salud/minsal_news.py'
      - '.github/workflows/daily-first-recovery.yml'
permissions:
  contents: read
concurrency:
  group: daily-first-recovery-${{ github.head_ref }}
  cancel-in-progress: false
jobs:
  recovery:
    if: github.head_ref == 'codex/daily-first-fonasa-isp-minsal-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RADAR_FAST_MODEL: gpt-5.6-luna
      RADAR_FAST_PER_RUN: 4
      RADAR_DEEP_PER_RUN: 0
      RADAR_FAST_PER_MONTH: 1500
      RADAR_DEEP_PER_MONTH: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest
      - name: Focused source and controlled recovery tests
        run: python -m pytest -q tests/test_daily_first_minsal.py tests/test_daily_first_control.py tests/test_public_source_integrity.py tests/test_minsal_pipeline.py
      - name: Public native discovery then at most four existing MINSAL assessments
        run: python scripts/daily_first_runtime.py --output artifacts/daily-first --assess
      - name: Independent read-only source evidence Reviewer
        run: python scripts/review_daily_first.py --runtime artifacts/daily-first --output artifacts/daily-first/reviewer.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-first-${{ github.run_id }}
          path: artifacts/daily-first/
          retention-days: 30
