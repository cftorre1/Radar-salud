<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar Salud · Piloto</title>
  <style>
    :root { color-scheme: light; --ink:#132238; --muted:#667085; --line:#e4e9ef; --bg:#f7f9fb; --card:#fff; --teal:#006b76; --teal-soft:#eaf7f7; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    main{max-width:920px;margin:0 auto;padding:40px 20px 72px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--teal);font-weight:800}
    h1{font-size:38px;letter-spacing:-.03em;margin:8px 0 4px}.sub{font-size:18px;color:var(--muted);margin:0 0 22px}.meta{display:flex;gap:10px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:8px}.count{font-size:13px;color:var(--teal);font-weight:700;margin:0 0 22px}
    .signal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 2px 9px rgba(16,24,40,.035)}
    .top{display:flex;gap:14px;align-items:flex-start}.body{min-width:0;flex:1}.priority{font-weight:800;font-size:11px;border-radius:999px;padding:6px 9px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}.priority.essential{background:#e9f7f1;color:#166b4d}.priority.relevant{background:#edf4ff;color:#285f9e}.priority.context{background:#f3f4f6;color:#5f6672}
    .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:750;margin:1px 0 5px}.grouped{margin-left:8px;color:var(--teal);text-transform:none;letter-spacing:0}.signal h2{font-size:20px;line-height:1.3;letter-spacing:-.015em;margin:0 0 10px}
    .signal p{line-height:1.58;margin:8px 0;color:#26364a}.label{font-weight:750;color:var(--ink)}.source{font-size:13px;color:var(--muted);margin-top:14px}.source a{color:var(--teal);font-weight:650;text-decoration:none}.source a:hover{text-decoration:underline}.world{margin-top:36px}.world h2{font-size:22px}.empty{padding:28px;background:#fff;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
    @media(max-width:640px){main{padding:28px 14px 56px} h1{font-size:32px}.sub{font-size:16px}.top{gap:10px}.priority{font-size:10px;padding:5px 7px}.signal{padding:16px}.signal h2{font-size:18px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">Piloto V0</div><h1>Radar Salud</h1><p class="sub">Lo importante del mercado de salud, filtrado para ti.</p>
  <div class="meta" id="meta"></div><div class="count" id="count"></div><div id="local"></div><section class="world" hidden><h2>🌎 Radar Mundo</h2><div id="world"></div></section>
</main><script src="app.js"></script></body></html>
