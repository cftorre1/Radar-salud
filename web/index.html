<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar Salud · Piloto</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#e6e8ec; --bg:#f7f8fa; --card:#fff; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    main{max-width:860px;margin:0 auto;padding:32px 18px 64px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
    h1{font-size:34px;margin:6px 0 4px}.sub{color:var(--muted);margin:0 0 24px}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:20px}
    .signal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 1px 2px rgba(16,24,40,.03)}
    .top{display:flex;gap:10px;align-items:flex-start}.score{font-weight:800;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap}.signal h2{font-size:19px;line-height:1.3;margin:0 0 10px}
    .signal p{line-height:1.5;margin:8px 0}.label{font-weight:700}.source{font-size:13px;color:var(--muted);margin-top:12px}.source a{color:inherit}.world{margin-top:32px}.empty{padding:28px;background:#fff;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
  </style>
</head>
<body><main>
  <div class="eyebrow">Piloto V0</div><h1>Radar Salud</h1><p class="sub">Lo importante del mercado de salud, filtrado para ti.</p>
  <div class="meta" id="meta"></div><div id="local"></div><section class="world"><h2>🌎 Radar Mundo</h2><div id="world"></div></section>
</main><script src="app.js"></script></body></html>
