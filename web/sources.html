<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Fuentes · Alicanto Salud</title><link rel="stylesheet" href="product-ui.css"/></head><body><main class="sources-page"><nav class="topnav" aria-label="Navegación principal"><a href="index.html">Radar · Chile</a><a href="global.html">Global · Internacional</a><a href="sources.html" aria-current="page">Fuentes</a></nav><h1>Fuentes de Alicanto</h1><p id="sourcesContext">Catálogo de superficies activas verificadas. La selección depende de la evidencia y relevancia de cada publicación.</p><p class="source-legend"><span><i class="d fresh"></i>Al día</span><span><i class="d"></i>Activa</span><span><i class="d partial"></i>Parcial</span><span><i class="d trial"></i>En prueba</span><span>Fecha = contenido más reciente capturado</span></p><div id="catalog" aria-live="polite">Cargando fuentes…</div></main><script src="public-sources.js"></script><script>fetch('data/public_sources.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(async d=>{const health=await fetch('data/source_health.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);const list=AlicantoSources.render(document.getElementById('catalog'),d.sources,health);document.getElementById('sourcesContext').textContent=AlicantoSources.context(list,health)}).catch(()=>document.getElementById('catalog').textContent='No se pudo cargar el catálogo.');</script></body></html>
